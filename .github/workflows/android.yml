name: Build Cosmora TV

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK + AAB
        run: |
          gradle :app:assembleDebug --stacktrace
          gradle :app:bundleDebug --stacktrace

      - name: Rename outputs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Cosmora-TV-V1.6.apk
          cp app/build/outputs/bundle/debug/app-debug.aab Cosmora-TV-V1.6.aab

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Cosmora-TV-V1.6
          path: |
            Cosmora-TV-V1.6.apk
            Cosmora-TV-V1.6.aab
